# Copy to recrute.toml (or run `recrute init`). recrute.toml is gitignored.

[server]
host = "127.0.0.1"   # use "0.0.0.0" on the LAN server so other machines can reach the UI
port = 8765
# On a LAN, use HTTPS: the live browser view carries the passwords you type. Both, or neither:
# ssl_certfile = "data/tls/cert.pem"
# ssl_keyfile = "data/tls/key.pem"

[browser]
# "chrome" = your installed Google Chrome (recommended), "msedge", or "" for bundled Chromium
channel = "chrome"
headless = false

[llm]
timeout_seconds = 300   # per call; slow tasks (web research) may ask for more themselves

[llm.providers.claude]
command = "claude"
model = ""           # empty = CLI default
extra_args = []
web_max_turns = 14   # step cap (--max-turns) for calls that may search/fetch the web

[llm.providers.codex]
command = "codex"
model = ""
extra_args = []      # e.g. ["-c", "model_reasoning_effort=\"low\""]

# task -> "provider" or "provider:model", in order; later ones are fallbacks
# (e.g. when a usage limit is hit). Lighter models for high-volume tasks save quota.
# Entries here override the built-in route for that task only: tasks you leave out keep
# their built-in route (listed below), and tasks without one use "default".
[llm.routing]
default = ["claude:sonnet", "codex"]
triage  = ["codex", "claude:haiku"]
tailor  = ["claude:sonnet", "codex"]
verify  = ["claude:sonnet", "codex"]
extract = ["claude:sonnet", "codex"]          # mega-resume ingest
extract_postings = ["codex", "claude:haiku"]  # HN "Who's hiring" posting extraction
answers = ["claude:sonnet", "codex"]          # drafting form answers
classify_email = ["codex", "claude:haiku"]    # inbox tracking
followup = ["claude:sonnet", "codex"]         # follow-up email drafts
form_map = ["claude:sonnet", "codex"]         # unknown application forms
job_brief = ["claude:haiku", "codex"]         # plain-language summary of a posting
company_research = ["claude:sonnet", "codex"] # public web research on an employer (web tools)
company_fit = ["claude:haiku", "codex"]       # how the researched company fits you (no tools)
