<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Save to Recrute: options</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 16px; min-width: 420px; }
    label { display: block; margin: 12px 0 4px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 6px; font: inherit; }
    .hint { color: #555; font-size: 12px; margin-top: 4px; }
    button { margin-top: 16px; padding: 6px 14px; font: inherit; }
    #status { margin-left: 8px; }
  </style>
</head>
<body>
  <label for="serverUrl">Server capture URL</label>
  <input id="serverUrl" type="url" placeholder="http://127.0.0.1:8765/api/capture">
  <div class="hint">For a Recrute server on another machine, e.g. http://laptop.local:8765/api/capture.
    Chrome will ask once for permission to reach that host.</div>

  <label for="token">Token</label>
  <input id="token" type="password" autocomplete="off">
  <div class="hint">Must match the capture token configured on the Recrute server.
    Stored only in this browser profile (not synced).</div>

  <button id="save">Save</button><span id="status"></span>
  <script type="module" src="options.js"></script>
</body>
</html>
