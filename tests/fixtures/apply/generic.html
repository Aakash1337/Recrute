<!DOCTYPE html>
<!-- An unknown, hand-rolled careers form (no ATS). Has a site search form in the header that
     must not be mistaken for the application form, plus a required custom question
     ("favorite security tool") that the approved packet does not answer. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apply - Security Analyst - Acme Robotics</title>
<style>
  body { font-family: sans-serif; max-width: 720px; margin: 0 auto; padding: 24px; }
  .row { margin: 14px 0; }
  .row > label, .q { display: block; font-weight: 600; margin-bottom: 4px; }
  input[type=text], input[type=email], input[type=tel], input[type=url], select, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
</style>
</head>
<body>
<header><form action="/search" method="get" role="search"><input type="search" name="q" aria-label="Search site"><button>Search</button></form></header>
<h1>Security Analyst</h1>

<form id="careers-apply" action="/generic/submit" method="post" enctype="multipart/form-data">
  <div class="row"><label for="fullname">Full name <abbr title="required">*</abbr></label>
    <input type="text" id="fullname" name="fullname" required></div>
  <div class="row"><label for="mail">Email address *</label>
    <input type="email" id="mail" name="mail" required></div>
  <div class="row"><label for="tel">Phone</label>
    <input type="tel" id="tel" name="tel"></div>
  <div class="row"><label for="portfolio">Portfolio / GitHub URL</label>
    <input type="url" id="portfolio" name="portfolio"></div>
  <div class="row"><label for="yoe">Years of security experience *</label>
    <select id="yoe" name="yoe" required><option value="">Choose...</option><option>0-1</option><option>2-4</option><option>5+</option></select></div>
  <div class="row"><span class="q" id="reloc-q">Willing to relocate? *</span>
    <div role="radiogroup" aria-labelledby="reloc-q">
      <label><input type="radio" name="relocate" value="yes" required> Yes</label>
      <label><input type="radio" name="relocate" value="no"> No</label>
    </div></div>
  <div class="row"><label for="why">Why do you want to work here? *</label>
    <textarea id="why" name="why" required></textarea></div>
  <div class="row"><label for="tool">What is your favorite security tool? *</label>
    <input type="text" id="tool" name="tool" required></div>
  <div class="row"><label for="cv">Upload your resume *</label>
    <input type="file" id="cv" name="cv" required></div>
  <div class="row"><label><input type="checkbox" name="privacy" id="privacy" required> I agree to the privacy policy *</label></div>
  <button type="submit">Send application</button>
</form>
</body>
</html>
