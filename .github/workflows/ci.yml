name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Install browser (for browser-marked tests)
        run: uv run patchright install --with-deps chromium
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q
        env:
          RECRUTE_CI: "1"
