# Search criteria. Copy to criteria.yaml (gitignored) and edit.
# tracks: priority tiers (P0 highest). Jobs match the highest-priority track whose title keywords hit.
# eligibility: drops jobs legally closed to you. Visa/sponsorship is NEVER a filter (badges only).
# min_score: minimum LLM fit score (0-100) per priority to reach the review queue.
country: US
allow_remote: true
locations: []
employment_types:
- full-time
exclude_title_keywords:
- intern
- internship
- co-op
- senior
- sr.
- 'sr '
- staff
- principal
- lead
- manager
- director
- head of
- vp
- vice president
- chief
- architect
- distinguished
- part-time
- part time
- contract
- temporary
max_years_required: 5
exclude_companies: []
salary_floor: null
eligibility:
  drop_clearance_required: true
  drop_citizenship_required: true
  drop_itar_us_person: true
min_score:
  P0: 55
  P1: 55
  P2: 65
  P3: 75
