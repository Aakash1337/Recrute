[project]
name = "recrute"
version = "0.1.0"
description = "Human-in-the-loop job discovery and application system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "sqlmodel>=0.0.22",
    "pydantic>=2.9",
    "typer>=0.13",
    "httpx>=0.28",
    "patchright>=1.49",
    "pyyaml>=6.0.3",
    "python-docx>=1.2.0",
    "pypdf>=6.19.0",
    "typst>=0.15.0",
    "markdownify>=1.2.3",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "curl-cffi>=0.16.3",
    "keyring>=25.7.0",
    "rapidfuzz>=3.14.6",
    "python-dateutil>=2.9.0.post0",
]

[project.scripts]
recrute = "recrute.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recrute"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
